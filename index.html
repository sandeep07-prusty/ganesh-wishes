<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganesh Puja Portal | Sandeep</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Noto Sans Oriya', sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1a1008 0%, #060402 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
      overflow-x: hidden;
    }

    .portal-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      min-height: 660px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(15, 10, 5, 0.95);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255, 102, 0, 0.3);
    }

    .portal-container::before {
      content: '';
      position: absolute;
      width: 250%;
      height: 250%;
      background-image: conic-gradient(
        transparent 0%,
        #ff9900 12%,
        #ff4500 24%,
        #d81b60 36%,
        transparent 45%
      );
      animation: rotateBorder 5s linear infinite;
    }

    .portal-inner {
      position: absolute;
      inset: 4px;
      background: linear-gradient(145deg, #1c120a 0%, #0a0704 100%);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 22px 50px 22px;
      z-index: 10;
      overflow-y: auto;
      max-height: calc(100vh - 40px);
    }

    .portal-inner::-webkit-scrollbar {
      width: 4px;
    }
    .portal-inner::-webkit-scrollbar-thumb {
      background: #ff7700;
      border-radius: 10px;
    }

    .ganesha-icon {
      font-size: 55px;
      color: #ff9900;
      text-shadow: 0 0 25px #ff6600, 0 0 50px #ff3300;
      animation: floatGlow 2.5s ease-in-out infinite;
      margin-bottom: 8px;
    }

    .view-screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.35s ease forwards;
    }

    .view-screen.active {
      display: flex;
    }

    .back-btn {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 153, 0, 0.3);
      color: #ff9900;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 18px;
      transition: 0.3s;
      z-index: 20;
    }

    .back-btn:hover {
      background: #ff7700;
      color: #fff;
      transform: scale(1.1);
      box-shadow: 0 0 15px #ff7700;
    }

    h2 {
      font-size: 20px;
      text-align: center;
      color: #ffb74d;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 183, 77, 0.3);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 6px;
    }

    .choice-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 153, 0, 0.2);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #f5f5f5;
    }

    .choice-card:hover {
      background: rgba(255, 102, 0, 0.15);
      border-color: #ff9900;
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(255, 102, 0, 0.3);
    }

    .choice-card .main-txt {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffcc80;
    }

    .choice-card .sub-txt {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
    }

    .lang-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 280px;
      margin-top: 20px;
    }

    .lang-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 153, 0, 0.3);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      transition: 0.3s;
      color: #ffb74d;
    }

    .lang-card:hover {
      background: linear-gradient(90deg, #ff7700, #ff9900);
      color: #111;
      box-shadow: 0 0 25px rgba(255, 119, 0, 0.6);
      transform: scale(1.03);
    }

    .input-box-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .custom-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 153, 0, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      text-align: center;
      transition: 0.3s;
    }

    .custom-input:focus {
      border-color: #ff9900;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    .proceed-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #ff7700, #ff9900);
      border: none;
      border-radius: 12px;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(255, 102, 0, 0.4);
    }

    .proceed-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 102, 0, 0.6);
    }

    .wish-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 153, 0, 0.25);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      width: 100%;
      box-shadow: inset 0 0 25px rgba(255, 119, 0, 0.08);
      margin-top: 10px;
    }

    .wish-heading {
      font-size: 21px;
      font-weight: 700;
      color: #ff9900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(255, 153, 0, 0.6);
      margin-bottom: 6px;
    }

    .relation-badge {
      display: inline-block;
      background: rgba(255, 153, 0, 0.15);
      border: 1px solid #ff9900;
      color: #ffb74d;
      font-size: 11px;
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .quote-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid #ff9900;
      padding: 16px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: left;
    }

    .quote-txt {
      font-size: 14.5px;
      line-height: 1.9;
      color: #fff3e0;
      font-weight: 500;
      white-space: pre-line;
    }

    .closing-txt {
      font-size: 14px;
      color: #ff9900;
      font-weight: 600;
      border-top: 1px dashed rgba(255, 153, 0, 0.3);
      padding-top: 14px;
      line-height: 1.6;
    }

    .signature {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 153, 0, 0.25);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 100;
    }

    .signature span {
      color: #ff9900;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 153, 0, 0.6);
    }

    @keyframes rotateBorder {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes floatGlow {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.06); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display: none;">←</button>

          <div class="lang-card" onclick="chooseLang('en')">English</div>

      </div>

      <!-- SCREEN 2: Relation Grid -->
      <div class="view-screen" id="screen-rel">

        <div class="btn-grid" id="rel-grid"></div>
      </div>

      <!-- SCREEN 3: Name / Nickname Input -->
      <div class="view-screen" id="screen-input">
        <h2 id="input-title">ନାମ ଲେଖନ୍ତୁ</h2>
        <div class="input-box-container">
          <input type="text" id="user-nickname" class="custom-input" placeholder="Type name here..." autocomplete="off" />
          <button class="proceed-btn" onclick="submitName()">ଆଗକୁ ବଢ଼ନ୍ତୁ (Proceed) ➔</button>

      </div>

      <!-- SCREEN 4: Showcase -->
      <div class="view-screen" id="screen-wish">

            <p class="quote-txt" id="quote-content"></p>
          </div>
          <div class="closing-txt" id="closing-content"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="signature">

    function showView(viewId) {
      document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      const backBtn = document.getElementById('backBtn');
      if (viewId === 'screen-lang') {
        backBtn.style.display = 'none';
        viewHistory = ['screen-lang'];
      } else {
        backBtn.style.display = 'flex';
      }
    }

    function chooseLang(lang) {
      currentLang = lang;
      viewHistory.push('screen-rel');
      renderRelations();
      showView('screen-rel');
    }

    function renderRelations() {
      const title = document.getElementById('rel-title');
      const grid = document.getElementById('rel-grid');
      grid.innerHTML = '';

      if (currentLang === 'odia') {
        title.textContent = "ଆପଣ ସନ୍ଦୀପଙ୍କର କିଏ ହେବେ?";
      } else {
        title.textContent = "How are you related to Sandeep?";
      }

      for (const key in relationData) {
        const item = relationData[key][currentLang];
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.innerHTML = `
          <div class="main-txt">${item.label}</div>
          <div class="sub-txt">${item.sub}</div>
        `;
        card.onclick = () => handleRelationClick(key);
        grid.appendChild(card);
      }
    }

    function handleRelationClick(key) {
      selectedRelationKey = key;
      const relInfo = relationData[key];

      if (relInfo.askName) {
        const inputTitle = document.getElementById('input-title');
        const inputField = document.getElementById('user-nickname');
        inputField.value = '';

        if (currentLang === 'odia') {
          inputTitle.textContent = "ଆପଣଙ୍କ ନାମ / Nickname ଲେଖନ୍ତୁ:";
          inputField.placeholder = "ଏଠାରେ ନାମ ଲେଖନ୍ତୁ...";
        } else {
          inputTitle.textContent = "Enter your Name / Nickname:";
          inputField.placeholder = "Type your name here...";
        }

        viewHistory.push('screen-input');
        showView('screen-input');
        setTimeout(() => inputField.focus(), 200);
      } else {
        renderWishScreen('');
      }
    }

    function submitName() {
      const inputField = document.getElementById('user-nickname');
      let name = inputField.value.trim();
      if (!name) {
        name = currentLang === 'odia' ? "ମୋର ପ୍ରିୟଜନ" : "Dear";
      }
      renderWishScreen(name);
    }

    function renderWishScreen(enteredName) {
      const relObj = relationData[selectedRelationKey];
      const data = relObj[currentLang];

      let headingText = data.heading;
      let quoteText = data.quote;

      if (relObj.askName) {
        headingText = headingText.replace('{NAME}', enteredName);
        quoteText = quoteText.replaceAll('{NAME}', enteredName);
      }

      document.getElementById('wish-headline').textContent = headingText;
      document.getElementById('badge-rel').textContent = data.label;
      document.getElementById('quote-content').textContent = quoteText;
      document.getElementById('closing-content').textContent = data.closing;

      viewHistory.push('screen-wish');
      showView('screen-wish');
    }

    function goBack() {
      if (viewHistory.length > 1) {
        viewHistory.pop();
        const prev = viewHistory[viewHistory.length - 1];
        showView(prev);
      }
    }

    document.getElementById('user-nickname').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        submitName();
      }
    });
  </script>
